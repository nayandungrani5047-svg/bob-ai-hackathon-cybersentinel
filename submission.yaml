submission:
  title: "CyberSentinel - D2 Threat Intelligence Assistant"

  problem_statement: >
    Defence and security analysts can receive large volumes of alerts from
    SIEM systems, cyber sensors, satellite feeds, and intelligence reports
    in different formats. Manually reviewing and correlating these alerts
    makes it difficult to identify genuine threats quickly while false
    positives consume valuable investigation time.

  solution_summary: >
    CyberSentinel is an AI-powered threat intelligence assistant that
    ingests synthetic multi-source alerts, normalizes and correlates them,
    identifies likely genuine threats and false positives, prioritizes
    incidents using weighted scoring, maps threats to MITRE ATT&CK techniques,
    and generates concise BLUF investigation summaries.

  key_features:
    - "Multi-source synthetic threat alert ingestion and normalization"
    - "Rule-based alert correlation and heuristic false-positive detection"
    - "Weighted threat prioritization with High, Medium, and Low risk levels"
    - "MITRE ATT&CK technique mapping for identified threats"
    - "Investigation dashboard with concise BLUF summaries"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite"]
    other: ["Docker", "GitHub Actions", "Chart.js", "Synthetic JSON/CSV data"]

  what_we_are_most_proud_of: >
    We are most proud of building an end-to-end defensive threat intelligence
    workflow that turns large volumes of synthetic alerts into correlated,
    prioritized, and investigation-ready incidents with MITRE ATT&CK mapping
    and BLUF summaries.

  known_limitations: >
    The current hackathon MVP uses synthetic alert data, local rule-based
    correlation, heuristic false-positive detection, weighted scoring, and
    local MITRE ATT&CK mappings. It is a prototype and is not connected to
    real defence or government systems or production threat feeds.

